          PATCH_BASE64
          python3 - <<'PYTHON'
          import zipfile
          from pathlib import Path, PurePosixPath
          base = Path.cwd()
          with zipfile.ZipFile('/tmp/harmonywake-v8-patch.zip') as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe patch path')
                  # Workflow was already parsed; do not overwrite it in the checkout.
                  if p.parts and p.parts[0] == '.github':
                      continue
                  destination = base.joinpath(*p.parts)
                  if item.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(z.read(item))
          PYTHON
          python3 tools/apply_v8_schedule.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test random and dependent scheduling
        run: bash tools/test_schedule.sh

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build debug APK
        run: gradle -p HarmonyWake-source assembleDebug --stacktrace

      - name: Prepare installable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp HarmonyWake-source/app/build/outputs/apk/debug/app-debug.apk deliverables/HarmonyWake-v8-debug.apk
          (cd deliverables && sha256sum HarmonyWake-v8-debug.apk > SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyWake-v8-APK
          path: deliverables/
          if-no-files-found: error
